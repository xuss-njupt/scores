name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Type check
        run: npm run typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://hwxsuieolykxfgjxitra.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__b7h-hh2gBRKYL0mKWuo5w_6ZRUg8CS
          GITHUB_PAGES: "true"
      - name: Build static GitHub Pages site
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://hwxsuieolykxfgjxitra.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__b7h-hh2gBRKYL0mKWuo5w_6ZRUg8CS
          GITHUB_PAGES: "true"
